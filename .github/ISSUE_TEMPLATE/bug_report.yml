name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
